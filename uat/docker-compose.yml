services:

  consul:
    image: hashicorp/consul:${OL_CONSUL_VERSION}
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    environment:
      CONSUL_BIND_INTERFACE: eth0
    ports:
      - "8300:8300"
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 30s
      timeout: 5s
      retries: 10

  nginx:
    image: openlmis/nginx:${OL_NGINX_VERSION}
    ports:
      - "80:80"
    env_file: settings.env
    environment:
      NGINX_LOG_DIR: '/var/log/nginx/log'
    volumes:
      - 'nginx-log:/var/log/nginx/log'
      - 'consul-template-log:/var/log/consul-template'
    depends_on:
      consul:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 20000
        hard: 40000

  ui:
    restart: always
    image: openlmisrdc/ui:${DRC_UI_VERSION}
    env_file: settings.env
    depends_on:
      consul:
        condition: service_healthy
      # Services from which data is being taken during logging in
      referencedata:
        condition: service_healthy
      auth:
        condition: service_healthy
      notification:
        condition: service_healthy
      report:
        condition: service_healthy
      fulfillment:
        condition: service_healthy
      stockmanagement:
        condition: service_healthy

  openlmis-ui:
    restart: always
    image: openlmis/openlmis-ui:${OL_UI_VERSION}
    env_file: settings.env
    environment:
      BASE_PATH: /v2
    depends_on:
      consul:
        condition: service_healthy

  requisition:
    restart: always
    image: openlmis/requisition:${OL_REQUISITION_VERSION}
    env_file: settings.env
    environment:
      JAVA_OPTS: '-server -Xmx1536m -Dlogging.config=/config/log/logback.xml -Dflyway.locations=classpath:db/migration'
    volumes:
      - 'service-config:/config'
      - 'syslog:/var/log'
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      log:
        condition: service_started
      consul:
        condition: service_healthy
    healthcheck:
      test: "wget --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20m

  referencedata:
    restart: always
    image: openlmis/referencedata:${OL_REFERENCEDATA_VERSION}
    env_file: settings.env
    environment:
      JAVA_OPTS: '-server -Xmx1536m -Dlogging.config=/config/log/logback.xml -Dflyway.locations=classpath:db/migration'
    volumes:
      - 'service-config:/config'
      - 'syslog:/var/log'
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      log:
        condition: service_started
      consul:
        condition: service_healthy
    healthcheck:
      test: "wget --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20m

  auth:
    restart: always
    image: openlmis/auth:${OL_AUTH_VERSION}
    env_file: settings.env
    environment:
      JAVA_OPTS: '-server -Xmx512m -Dlogging.config=/config/log/logback.xml -Dflyway.locations=classpath:db/migration'
    volumes:
      - 'service-config:/config'
      - 'auth-tomcat-log:/var/log/auth-tomcat'
      - 'syslog:/var/log'
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      log:
        condition: service_started
      consul:
        condition: service_healthy
    healthcheck:
      test: "wget --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20m

  notification:
    restart: always
    image: openlmis/notification:${OL_NOTIFICATION_VERSION}
    env_file: settings.env
    environment:
      JAVA_OPTS: '-server -Xmx512m -Dlogging.config=/config/log/logback.xml -Dflyway.locations=classpath:db/migration'
    volumes:
      - 'service-config:/config'
      - 'syslog:/var/log'
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      log:
        condition: service_started
      consul:
        condition: service_healthy
    healthcheck:
      test: "wget --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20m

  fulfillment:
    restart: always
    image: openlmis/fulfillment:${OL_FULFILLMENT_VERSION}
    env_file: settings.env
    environment:
      JAVA_OPTS: '-server -Xmx1024m -Dlogging.config=/config/log/logback.xml -Dflyway.locations=classpath:db/migration'
    volumes:
      - 'service-config:/config'
      - 'syslog:/var/log'
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      log:
        condition: service_started
      consul:
        condition: service_healthy
    healthcheck:
      test: "wget --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20m

  cce:
    restart: always
    image: openlmis/cce:${OL_CCE_VERSION}
    env_file: settings.env
    environment:
      JAVA_OPTS: '-server -Xmx1024m -Dlogging.config=/config/log/logback.xml -Dflyway.locations=classpath:db/migration'
    volumes:
      - 'service-config:/config'
      - 'syslog:/var/log'
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      log:
        condition: service_started
      consul:
        condition: service_healthy

  stockmanagement:
    restart: always
    image: openlmis/stockmanagement:${OL_STOCKMANAGEMENT_VERSION}
    env_file: settings.env
    environment:
      JAVA_OPTS: '-server -Xmx1536m -Dlogging.config=/config/log/logback.xml -Dflyway.locations=classpath:db/migration'
    volumes:
      - 'service-config:/config'
      - 'syslog:/var/log'
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      log:
        condition: service_started
      consul:
        condition: service_healthy
    healthcheck:
      test: "wget --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20m

  report:
    restart: always
    image: openlmisrdc/report:${DRC_REPORT_VERSION}
    env_file: settings.env
    environment:
      JAVA_OPTS: '-server -Xmx2560m -Dlogging.config=/config/log/logback.xml -Dflyway.locations=classpath:db/migration'
    volumes:
      - 'service-config:/config'
      - 'syslog:/var/log'
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      log:
        condition: service_started
      consul:
        condition: service_healthy
    healthcheck:
      test: "wget --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20m

  hapifhir:
    restart: always
    image: openlmis/hapifhir:${OL_HAPIFHIR_VERSION}
    env_file: settings.env
    environment:
      JAVA_OPTS: '-server -Xmx512m -Dlogging.config=/config/log/logback.xml'
    volumes:
      - 'service-config:/config'
      - 'syslog:/var/log'
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      log:
        condition: service_started
      consul:
        condition: service_healthy

  log:
    restart: always
    image: openlmis/rsyslog:${OL_RSYSLOG_VERSION}
    volumes:
      - 'syslog:/var/log'
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      consul:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
    ports:
      - "9100:9100"

  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION}
    volumes:
      - 'service-config:/config:ro'
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/config/promtail/promtail-config.yaml
    restart: unless-stopped
    depends_on:
      service-configuration:
        condition: service_completed_successfully

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION}
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    devices:
      - /dev/kmsg
    ports:
      - "9180:8080"

  service-configuration:
    build:
      context: ./config
    volumes:
      - service-config:/config

  redis:
    image: redis:3.2.12
    depends_on:
      consul:
        condition: service_healthy

volumes:
  syslog:
    external: false
  nginx-log:
    external: false
  auth-tomcat-log:
    external: false
  consul-template-log:
    external: false
  service-config:
    external: false
