# RDC overrides of the openlmis-report translation bundle (English).
#
# The base bundle is the Transifex resource openlmis-report.report-translations, shipped
# in the report service image. This file is merged on top of it by
# ReportTranslationBundleProvider (mounted at /config/reports/resourceBundles).

### RDC wording of core keys
# Only keys whose RDC value differs from the Transifex English value.
report.column.quantityReturned=Quantity Rejected
report.column.stockOnHand=Stock on hand
report.column.stockOnHandDoses=Stock On Hand\n(Doses)
report.column.stockOnHandPacks=Stock On Hand\n(Packs)
report.globalHeader.subtitle=LOGIMEV report
report.globalHeader.title=Ministry of Public Health, Hygiene and Social Prevention of the Democratic Republic of Congo
report.header.toManagingDirector=To The Managing Director\nMedical Stores Ltd.\nLusaka\nFax numbers: 01-241193,01-246288
report.summary.explainDiscrepancies=Explain any discrepancies or Damages
report.title.issueVoucher=Ministry of Health and Social Welfare\nIssue Voucher for Medical \nSupplies (PH81-N/E)
report.title.nonReportingFacility=Ministry of Health and Social Welfare\nNon Reporting Facility Report
report.title.proofOfDeliveryFor=Proof of Delivery for
report.title.stockOnHand=Stock On Hand

### RDC-only keys
# Keys that do not exist in the Transifex resource; used by the RDC-owned templates.
# They reach the bundle only through this file - every environment needs them.
report.header.geographicLevel=Geographic Level
